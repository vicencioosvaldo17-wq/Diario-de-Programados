<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Literata:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #eef1ef;
    --paper-line: #d7ddd9;
    --ink: #1c2b3a;
    --ink-soft: #4a5a68;
    --teal: #2f6f63;
    --teal-dim: #b9d2cb;
    --amber: #c97a2b;
    --code-bg: #1e2126;
    --code-fg: #e7e9df;
    --card: #f7f8f6;
    --danger: #a4453a;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: 'Literata', serif;
    display:flex;
    min-height:100vh;
  }

  /* ---------- Sidebar / spine ---------- */
  .spine{
    width: 64px;
    flex-shrink:0;
    background: linear-gradient(180deg, #24344a, #1c2b3a);
    position: relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 18px 0;
  }
  .spine .hole{
    width:10px; height:10px; border-radius:50%;
    background: var(--paper);
    margin: 14px 0;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.4);
  }
  .spine .brand{
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family:'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--teal-dim);
    margin-top: auto;
    margin-bottom: 18px;
  }

  .sidebar{
    width: 300px;
    flex-shrink: 0;
    background: rgba(247,248,246,0.7);
    border-right: 1px solid var(--paper-line);
    display:flex;
    flex-direction:column;
    height:100vh;
    position:sticky;
    top:0;
  }
  .sidebar-header{
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--paper-line);
  }
  .sidebar-header h1{
    font-family:'Space Mono', monospace;
    font-size: 15px;
    font-weight:700;
    margin:0 0 2px;
    letter-spacing: 0.5px;
  }
  .sidebar-header p{
    margin:0;
    font-size: 12px;
    color: var(--ink-soft);
    font-family:'Space Mono', monospace;
  }
  .new-entry-btn{
    margin: 14px 20px 8px;
    padding: 10px 14px;
    background: var(--ink);
    color: var(--paper);
    border:none;
    border-radius: 4px;
    font-family:'Space Mono', monospace;
    font-size: 13px;
    cursor:pointer;
    letter-spacing:0.3px;
    transition: background .15s ease, transform .1s ease;
  }
  .new-entry-btn:hover{ background: var(--teal); }
  .new-entry-btn:active{ transform: scale(0.98); }

  .entry-list{
    flex:1;
    overflow-y:auto;
    padding: 6px 0 20px;
  }
  .entry-row{
    display:flex;
    align-items:baseline;
    gap: 10px;
    padding: 9px 20px;
    cursor:pointer;
    border-left: 3px solid transparent;
    font-family:'Space Mono', monospace;
  }
  .entry-row:hover{ background: rgba(47,111,99,0.08); }
  .entry-row.active{
    border-left-color: var(--teal);
    background: rgba(47,111,99,0.12);
  }
  .entry-row .lineno{
    color: var(--ink-soft);
    font-size: 11px;
    opacity: .6;
    min-width: 24px;
  }
  .entry-row .meta{ min-width:0; }
  .entry-row .title{
    font-size: 12.5px;
    color: var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .entry-row .date{
    font-size: 10.5px;
    color: var(--ink-soft);
  }
  .empty-list{
    padding: 20px;
    font-size: 12.5px;
    color: var(--ink-soft);
    font-family:'Space Mono', monospace;
    line-height:1.6;
  }

  /* ---------- Main page ---------- */
  main{
    flex:1;
    padding: 40px 56px 80px;
    max-width: 860px;
  }
  .page-head{
    display:flex;
    justify-content: space-between;
    align-items:flex-start;
    gap: 20px;
    margin-bottom: 22px;
  }
  .date-stamp{
    font-family: 'Caveat', cursive;
    font-size: 30px;
    color: var(--amber);
    line-height:1;
  }
  .field-row{ margin-bottom: 16px; }
  label{
    display:block;
    font-family:'Space Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  input[type=text], textarea, select{
    width:100%;
    border: none;
    border-bottom: 1px solid var(--paper-line);
    background: transparent;
    font-family: 'Literata', serif;
    font-size: 16px;
    color: var(--ink);
    padding: 6px 2px 10px;
    outline:none;
  }
  input[type=text]:focus, textarea:focus, select:focus{
    border-bottom-color: var(--teal);
  }
  #titleInput{
    font-size: 26px;
    font-weight: 600;
    border-bottom: 2px solid var(--paper-line);
  }
  textarea{
    resize: vertical;
    line-height: 1.65;
    min-height: 110px;
  }
  .row2{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .tags-input{ font-family:'Space Mono', monospace; font-size: 13px; }

  .code-block-wrap{
    background: var(--code-bg);
    border-radius: 6px;
    overflow:hidden;
    margin-top: 4px;
  }
  .code-block-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 8px 12px;
    background: #16181c;
    border-bottom: 1px solid #2a2e35;
  }
  .code-block-head .dots{ display:flex; gap:6px; }
  .code-block-head .dots span{
    width:9px; height:9px; border-radius:50%; display:inline-block;
  }
  .dots span:nth-child(1){ background:#e0605a; }
  .dots span:nth-child(2){ background:#e0b95a; }
  .dots span:nth-child(3){ background:#5ac97a; }
  .code-block-head select{
    background: transparent;
    color: var(--teal-dim);
    font-family:'Space Mono', monospace;
    font-size: 11px;
    border-bottom:none;
    padding: 2px 4px;
    width:auto;
  }
  .file-tabs{
    display:flex;
    gap: 4px;
    overflow-x:auto;
    flex:1;
    margin: 0 10px;
  }
  .file-tab{
    display:flex;
    align-items:center;
    gap: 6px;
    padding: 4px 9px;
    background: #24272e;
    border-radius: 4px;
    font-family:'Space Mono', monospace;
    font-size: 11px;
    color: var(--teal-dim);
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .file-tab.active{
    background: var(--teal);
    color: white;
  }
  .file-tab .tab-close{
    opacity:.6;
    font-size:12px;
  }
  .file-tab .tab-close:hover{ opacity:1; }
  .tab-add-btn{
    background: #2a2e35;
    color: var(--teal-dim);
    border:none;
    border-radius: 4px;
    width: 24px; height: 24px;
    font-family:'Space Mono', monospace;
    font-size: 14px;
    cursor:pointer;
    flex-shrink:0;
  }
  .tab-add-btn:hover{ background: var(--teal); color:white; }
  .run-btn{
    background: var(--amber);
    color: white;
    border:none;
    border-radius: 4px;
    padding: 5px 12px;
    font-family:'Space Mono', monospace;
    font-size: 11.5px;
    cursor:pointer;
    flex-shrink:0;
  }
  .run-btn:hover{ background: #b0691f; }

  .preview-panel{
    margin-top: 14px;
    border-radius: 6px;
    overflow:hidden;
    border: 1px solid var(--paper-line);
  }
  .preview-head{
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding: 8px 12px;
    background: var(--card);
    font-family:'Space Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--paper-line);
  }
  .preview-frame{
    width:100%;
    height: 280px;
    border:none;
    background: white;
    display:block;
  }
  .console-output{
    background: #14161a;
    color: #d7dbe0;
    font-family:'Space Mono', monospace;
    font-size: 11.5px;
    padding: 8px 12px;
    max-height: 140px;
    overflow-y:auto;
    line-height:1.6;
  }
  .console-output .line{ border-bottom: 1px solid #22252b; padding: 3px 0; }
  .console-output .line.error{ color: #e0847a; }
  .console-output .line.warn{ color: #e0c05a; }
  .console-output:empty::before{
    content: 'la salida de console.log aparecerá aquí';
    opacity: .5;
  }
  #codeInput{
    background: transparent;
    color: var(--code-fg);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    line-height:1.6;
    border:none;
    padding: 14px 16px;
    min-height: 160px;
    width:100%;
  }
  #codeInput:focus{ border:none; }

  .mood-row{
    display:flex;
    gap: 10px;
    margin-top: 6px;
  }
  .mood-btn{
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--paper-line);
    background: var(--card);
    font-family:'Space Mono', monospace;
    font-size: 12px;
    cursor:pointer;
    color: var(--ink-soft);
  }
  .mood-btn.selected{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .actions{
    display:flex;
    gap: 12px;
    margin-top: 30px;
    align-items:center;
  }
  .save-btn{
    padding: 11px 22px;
    background: var(--teal);
    color: white;
    border:none;
    border-radius: 4px;
    font-family:'Space Mono', monospace;
    font-size: 13px;
    cursor:pointer;
  }
  .save-btn:hover{ background: #275c52; }
  .delete-btn{
    padding: 11px 16px;
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 4px;
    font-family:'Space Mono', monospace;
    font-size: 12.5px;
    cursor:pointer;
  }
  .save-status{
    font-family:'Space Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  .backup-panel{
    border-top: 1px solid var(--paper-line);
    padding: 14px 20px 18px;
  }
  .backup-title{
    font-family:'Space Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .backup-row{
    display:flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .mini-btn{
    flex:1;
    padding: 7px 8px;
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    font-family:'Space Mono', monospace;
    font-size: 11px;
    color: var(--ink);
    cursor:pointer;
    text-align:center;
  }
  .mini-btn:hover{ border-color: var(--teal); color: var(--teal); }
  .mini-btn.wide{ flex: 1 1 100%; }
  .gist-box{
    margin-top: 6px;
    padding: 10px;
    background: rgba(0,0,0,0.03);
    border-radius: 6px;
  }
  .mini-label{
    display:block;
    font-family:'Space Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  #gistToken{
    width:100%;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 6px 8px;
    font-family:'Space Mono', monospace;
    font-size: 12px;
    background: white;
  }
  #gistToken:focus{ outline:none; border-color: var(--teal); }
  .gist-status{
    margin-top: 8px;
    font-family:'Space Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    line-height:1.5;
  }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-thumb{ background: var(--paper-line); border-radius: 4px; }

  @media (max-width: 780px){
    body{ flex-direction: column; }
    .spine{ display:none; }
    .sidebar{ width:100%; height:auto; position:relative; }
    main{ padding: 28px; }
    .row2{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div class="spine">
    <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div>
    <div class="brand">DEV·JOURNAL</div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>~/dev-journal</h1>
      <p id="entryCount">0 entradas</p>
    </div>
    <button class="new-entry-btn" id="newEntryBtn">+ nueva entrada</button>
    <div class="entry-list" id="entryList"></div>

    <div class="backup-panel">
      <div class="backup-title">Respaldo</div>
      <div class="backup-row">
        <button class="mini-btn" id="exportBtn">⭳ exportar .json</button>
        <button class="mini-btn" id="importBtn">⭱ importar .json</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
      <div class="backup-row">
        <button class="mini-btn wide" id="firebaseToggleBtn">☁️ sincronizar con Firebase</button>
      </div>
      <div class="gist-box" id="firebaseBox" style="display:none;">
        <label class="mini-label">URL de tu Realtime Database</label>
        <input type="text" id="firebaseUrl" placeholder="https://tu-proyecto-default-rtdb.firebaseio.com">
        <label class="mini-label" style="margin-top:8px;">Secreto de autenticación (opcional)</label>
        <input type="password" id="firebaseSecret" placeholder="solo si tu DB no es pública">
        <div class="backup-row" style="margin-top:8px;">
          <button class="mini-btn" id="firebaseSaveBtn">guardar config</button>
          <button class="mini-btn" id="firebaseSyncBtn">subir ahora</button>
        </div>
        <div class="backup-row">
          <button class="mini-btn wide" id="firebasePullBtn">↓ traer desde la nube</button>
        </div>
        <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);">
          <input type="checkbox" id="firebaseAutoSync" style="width:auto;padding:0;">
          auto-sincronizar al guardar
        </label>
        <div class="gist-status" id="firebaseStatus"></div>
      </div>

      <div class="backup-row">
        <button class="mini-btn wide" id="gistToggleBtn">🐙 sincronizar con GitHub Gist</button>
      </div>
      <div class="gist-box" id="gistBox" style="display:none;">
        <label class="mini-label">Token de acceso personal (scope: gist)</label>
        <input type="password" id="gistToken" placeholder="ghp_xxxxxxxxxxxx">
        <div class="backup-row" style="margin-top:8px;">
          <button class="mini-btn" id="gistSaveTokenBtn">guardar token</button>
          <button class="mini-btn" id="gistSyncBtn">sincronizar ahora</button>
        </div>
        <div class="gist-status" id="gistStatus"></div>
      </div>
    </div>
  </aside>

  <main>
    <div class="page-head">
      <div>
        <input type="text" id="titleInput" placeholder="Título de la entrada">
      </div>
      <div class="date-stamp" id="dateStamp">hoy</div>
    </div>

    <div class="field-row">
      <label>Notas / bitácora</label>
      <textarea id="noteInput" placeholder="¿Qué resolviste hoy? ¿Con qué te trabaste? Ideas, decisiones, aprendizajes..."></textarea>
    </div>

    <div class="row2">
      <div class="field-row">
        <label>Etiquetas</label>
        <input type="text" class="tags-input" id="tagsInput" placeholder="bug-fix, refactor, react, sql...">
      </div>
      <div class="field-row">
        <label>Estado de ánimo</label>
        <div class="mood-row" id="moodRow">
          <button class="mood-btn" data-mood="🔥">🔥 en racha</button>
          <button class="mood-btn" data-mood="🧩">🧩 resolviendo</button>
          <button class="mood-btn" data-mood="😩">😩 frustrado</button>
          <button class="mood-btn" data-mood="✅">✅ shippeado</button>
        </div>
      </div>
    </div>

    <div class="field-row">
      <label>Archivos de código</label>
      <div class="code-block-wrap">
        <div class="code-block-head">
          <div class="dots"><span></span><span></span><span></span></div>
          <div class="file-tabs" id="fileTabs"></div>
          <button class="tab-add-btn" id="addFileBtn" title="agregar archivo">+</button>
          <button class="run-btn" id="runBtn">▶ ejecutar</button>
        </div>
        <textarea id="codeInput" placeholder="// pega o escribe tu código aquí" spellcheck="false"></textarea>
      </div>

      <div class="preview-panel" id="previewPanel" style="display:none;">
        <div class="preview-head">
          <span>Vista previa</span>
          <button class="mini-btn" id="closePreviewBtn" style="flex:none;">cerrar ✕</button>
        </div>
        <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-modals"></iframe>
        <div class="console-output" id="consoleOutput"></div>
      </div>
    </div>

    <div class="actions">
      <button class="save-btn" id="saveBtn">Guardar entrada</button>
      <button class="delete-btn" id="deleteBtn" style="display:none;">Eliminar</button>
      <span class="save-status" id="saveStatus"></span>
    </div>
  </main>

<script>
(function(){
  const STORAGE_KEY = 'entries-index';
  let entries = [];
  let currentId = null;
  let selectedMood = null;

  const entryList = document.getElementById('entryList');
  const entryCount = document.getElementById('entryCount');
  const titleInput = document.getElementById('titleInput');
  const noteInput = document.getElementById('noteInput');
  const tagsInput = document.getElementById('tagsInput');
  const codeInput = document.getElementById('codeInput');
  const fileTabs = document.getElementById('fileTabs');
  const addFileBtn = document.getElementById('addFileBtn');
  const runBtn = document.getElementById('runBtn');
  const previewPanel = document.getElementById('previewPanel');
  const previewFrame = document.getElementById('previewFrame');
  const consoleOutput = document.getElementById('consoleOutput');
  const dateStamp = document.getElementById('dateStamp');
  const saveStatus = document.getElementById('saveStatus');
  const deleteBtn = document.getElementById('deleteBtn');
  const moodRow = document.getElementById('moodRow');

  let files = [];
  let activeFileId = null;

  function genId(){ return 'f_' + Math.random().toString(36).slice(2,9); }

  function inferLangFromName(name){
    const ext = (name.split('.').pop() || '').toLowerCase();
    const map = {html:'html', htm:'html', css:'css', js:'javascript', mjs:'javascript',
      py:'python', ts:'typescript', java:'java', go:'go', rs:'rust', sql:'sql', sh:'bash', json:'json'};
    return map[ext] || 'otro';
  }

  function defaultNameForLang(lang){
    const map = {javascript:'snippet.js', python:'snippet.py', typescript:'snippet.ts',
      java:'Snippet.java', go:'snippet.go', rust:'snippet.rs', sql:'snippet.sql', bash:'snippet.sh'};
    return map[lang] || 'snippet.txt';
  }

  function syncActiveFileContent(){
    if(!activeFileId) return;
    const f = files.find(x=>x.id===activeFileId);
    if(f) f.content = codeInput.value;
  }

  function renderFileTabs(){
    fileTabs.innerHTML = '';
    files.forEach(f=>{
      const tab = document.createElement('div');
      tab.className = 'file-tab' + (f.id===activeFileId ? ' active' : '');
      tab.innerHTML = `<span>${escapeHtml(f.name)}</span>` + (files.length>1 ? `<span class="tab-close" data-id="${f.id}">×</span>` : '');
      tab.addEventListener('click', (ev)=>{
        if(ev.target.classList.contains('tab-close')) return;
        switchFile(f.id);
      });
      fileTabs.appendChild(tab);
    });
    fileTabs.querySelectorAll('.tab-close').forEach(btn=>{
      btn.addEventListener('click', (ev)=>{ ev.stopPropagation(); removeFile(btn.dataset.id); });
    });
  }

  function switchFile(id){
    syncActiveFileContent();
    activeFileId = id;
    const f = files.find(x=>x.id===id);
    codeInput.value = f ? f.content : '';
    renderFileTabs();
  }

  function addFile(){
    syncActiveFileContent();
    const name = prompt('Nombre del archivo (ej: style.css, script.js, index.html):', 'archivo.js');
    if(!name) return;
    if(files.some(f=>f.name === name)){
      alert('Ya existe un archivo con ese nombre.');
      return;
    }
    const f = { id: genId(), name: name.trim(), lang: inferLangFromName(name), content: '' };
    files.push(f);
    switchFile(f.id);
  }

  function removeFile(id){
    if(files.length <= 1) return;
    if(!confirm('¿Quitar este archivo de la entrada?')) return;
    files = files.filter(f=>f.id!==id);
    if(activeFileId === id){
      switchFile(files[0].id);
    } else {
      renderFileTabs();
    }
  }

  addFileBtn.addEventListener('click', addFile);

  function fmtDate(iso){
    const d = new Date(iso);
    const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }

  function shortDate(iso){
    const d = new Date(iso);
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(2)}`;
  }

  async function loadIndex(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      entries = res ? JSON.parse(res.value) : [];
    }catch(e){
      entries = [];
    }
    entries.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  }

  async function saveIndex(){
    await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
  }

  function renderList(){
    entryCount.textContent = entries.length === 1 ? '1 entrada' : `${entries.length} entradas`;
    if(entries.length === 0){
      entryList.innerHTML = `<div class="empty-list">Aún no hay entradas.<br>Escribe tu primer commit del día →</div>`;
      return;
    }
    entryList.innerHTML = '';
    entries.forEach((e, idx)=>{
      const row = document.createElement('div');
      row.className = 'entry-row' + (e.id === currentId ? ' active' : '');
      row.innerHTML = `
        <span class="lineno">${String(entries.length-idx).padStart(2,'0')}</span>
        <div class="meta">
          <div class="title">${e.mood ? e.mood+' ' : ''}${escapeHtml(e.title || 'Sin título')}</div>
          <div class="date">${shortDate(e.createdAt)}</div>
        </div>`;
      row.addEventListener('click', ()=> openEntry(e.id));
      entryList.appendChild(row);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function clearForm(){
    currentId = null;
    titleInput.value = '';
    noteInput.value = '';
    tagsInput.value = '';
    const f = { id: genId(), name: 'snippet.js', lang: 'javascript', content: '' };
    files = [f];
    activeFileId = f.id;
    codeInput.value = '';
    renderFileTabs();
    selectedMood = null;
    updateMoodButtons();
    dateStamp.textContent = fmtDate(new Date().toISOString());
    deleteBtn.style.display = 'none';
    saveStatus.textContent = '';
    hidePreview();
    titleInput.focus();
  }

  function openEntry(id){
    const e = entries.find(x=>x.id===id);
    if(!e) return;
    currentId = e.id;
    titleInput.value = e.title || '';
    noteInput.value = e.note || '';
    tagsInput.value = e.tags || '';
    if(e.files && e.files.length){
      files = e.files.map(f=>({...f}));
    } else {
      const lang = e.lang || 'javascript';
      files = [{ id: genId(), name: defaultNameForLang(lang), lang, content: e.code || '' }];
    }
    activeFileId = files[0].id;
    codeInput.value = files[0].content;
    renderFileTabs();
    selectedMood = e.mood || null;
    updateMoodButtons();
    dateStamp.textContent = fmtDate(e.createdAt);
    deleteBtn.style.display = 'inline-block';
    saveStatus.textContent = '';
    hidePreview();
    renderList();
  }

  function updateMoodButtons(){
    document.querySelectorAll('.mood-btn').forEach(btn=>{
      btn.classList.toggle('selected', btn.dataset.mood === selectedMood);
    });
  }

  moodRow.addEventListener('click', (ev)=>{
    const btn = ev.target.closest('.mood-btn');
    if(!btn) return;
    selectedMood = (selectedMood === btn.dataset.mood) ? null : btn.dataset.mood;
    updateMoodButtons();
  });

  async function saveEntry(){
    const title = titleInput.value.trim();
    if(!title){
      saveStatus.textContent = 'Ponle un título antes de guardar.';
      titleInput.focus();
      return;
    }
    syncActiveFileContent();
    const now = new Date().toISOString();
    if(currentId){
      const e = entries.find(x=>x.id===currentId);
      e.title = title;
      e.note = noteInput.value;
      e.tags = tagsInput.value;
      e.files = files.map(f=>({...f}));
      delete e.code;
      delete e.lang;
      e.mood = selectedMood;
      e.updatedAt = now;
    } else {
      currentId = 'entry_' + now.replace(/[^0-9]/g,'') + '_' + Math.floor(Math.random()*1000);
      entries.unshift({
        id: currentId,
        title,
        note: noteInput.value,
        tags: tagsInput.value,
        files: files.map(f=>({...f})),
        mood: selectedMood,
        createdAt: now,
        updatedAt: now
      });
    }
    try{
      await saveIndex();
      saveStatus.textContent = 'Guardado ✓';
      deleteBtn.style.display = 'inline-block';
      if(document.getElementById('firebaseAutoSync').checked){
        saveStatus.textContent = 'Guardado ✓ · sincronizando con la nube...';
        const ok = await syncToFirebase(true);
        saveStatus.textContent = ok ? 'Guardado ✓ · en la nube ☁️' : 'Guardado ✓ (falló la sincronización con la nube)';
      }
    }catch(e){
      saveStatus.textContent = 'Error al guardar. Intenta de nuevo.';
    }
    renderList();
  }

  async function deleteEntry(){
    if(!currentId) return;
    if(!confirm('¿Eliminar esta entrada? No se puede deshacer.')) return;
    entries = entries.filter(x=>x.id!==currentId);
    try{
      await saveIndex();
    }catch(e){}
    clearForm();
    renderList();
  }

  document.getElementById('newEntryBtn').addEventListener('click', clearForm);
  document.getElementById('saveBtn').addEventListener('click', saveEntry);
  deleteBtn.addEventListener('click', deleteEntry);

  // ---------- Ejecutar código (HTML / CSS / JS) ----------
  function hidePreview(){
    previewPanel.style.display = 'none';
    previewFrame.srcdoc = 'about:blank';
    consoleOutput.innerHTML = '';
  }

  document.getElementById('closePreviewBtn').addEventListener('click', hidePreview);

  function logToConsole(type, text){
    const line = document.createElement('div');
    line.className = 'line' + (type === 'error' ? ' error' : type === 'warn' ? ' warn' : '');
    line.textContent = (type === 'error' ? '✕ ' : type === 'warn' ? '⚠ ' : '› ') + text;
    consoleOutput.appendChild(line);
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  window.addEventListener('message', (ev)=>{
    if(ev.data && ev.data.__devjournal){
      logToConsole(ev.data.type, ev.data.args.join(' '));
    }
  });

  const CONSOLE_SHIM = `
    <script>
      (function(){
        function send(type, args){
          try{
            parent.postMessage({__devjournal:true, type, args: args.map(function(a){
              try{ return typeof a === 'object' ? JSON.stringify(a) : String(a); }catch(e){ return String(a); }
            })}, '*');
          }catch(e){}
        }
        ['log','error','warn','info'].forEach(function(m){
          const orig = console[m];
          console[m] = function(){ send(m, Array.prototype.slice.call(arguments)); orig && orig.apply(console, arguments); };
        });
        window.onerror = function(msg, src, line){ send('error', [msg + ' (línea ' + line + ')']); };
      })();
    <\/script>
  `;

  function runCode(){
    syncActiveFileContent();
    const htmlFile = files.find(f=>f.lang==='html');
    const cssFiles = files.filter(f=>f.lang==='css');
    const jsFiles = files.filter(f=>f.lang==='javascript');
    const hasRunnable = htmlFile || cssFiles.length || jsFiles.length;

    consoleOutput.innerHTML = '';

    if(!hasRunnable){
      const other = files.find(f=>f.lang && f.lang!=='html' && f.lang!=='css' && f.lang!=='javascript');
      previewPanel.style.display = 'block';
      previewFrame.srcdoc = 'about:blank';
      logToConsole('warn', `Ejecutar en vivo solo funciona con HTML, CSS y JavaScript por ahora. "${other ? other.name : 'este archivo'}" no se puede correr directo en el navegador.`);
      return;
    }

    const styleTags = cssFiles.map(f=>`<style>${f.content}</style>`).join('\n');
    const scriptTags = jsFiles.map(f=>`<script>${f.content}<\/script>`).join('\n');

    let doc;
    if(htmlFile){
      doc = htmlFile.content || '<!DOCTYPE html><html><head></head><body></body></html>';
      doc = doc.includes('</head>') ? doc.replace('</head>', styleTags + CONSOLE_SHIM + '</head>') : (CONSOLE_SHIM + styleTags + doc);
      doc = doc.includes('</body>') ? doc.replace('</body>', scriptTags + '</body>') : (doc + scriptTags);
    } else {
      doc = `<!DOCTYPE html><html><head>${CONSOLE_SHIM}${styleTags}</head><body>${scriptTags}</body></html>`;
    }

    previewPanel.style.display = 'block';
    previewFrame.srcdoc = doc;
  }

  runBtn.addEventListener('click', runCode);

  // ---------- Exportar / Importar JSON ----------
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(entries, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `dev-journal-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  const importFile = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', ()=> importFile.click());
  importFile.addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const imported = JSON.parse(text);
      if(!Array.isArray(imported)) throw new Error('formato inválido');
      const existingIds = new Set(entries.map(e=>e.id));
      let added = 0;
      imported.forEach(e=>{
        if(e && e.id && !existingIds.has(e.id)){
          entries.push(e);
          added++;
        }
      });
      entries.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
      await saveIndex();
      renderList();
      alert(`Se importaron ${added} entrada(s) nueva(s).`);
    }catch(e){
      alert('No se pudo leer el archivo. Asegúrate de que sea un backup válido de este diario.');
    }
    importFile.value = '';
  });

  // ---------- Firebase Realtime Database sync ----------
  const FB_URL_KEY = 'firebase-db-url';
  const FB_SECRET_KEY = 'firebase-db-secret';
  const FB_AUTOSYNC_KEY = 'firebase-autosync';
  const firebaseBox = document.getElementById('firebaseBox');
  const firebaseUrl = document.getElementById('firebaseUrl');
  const firebaseSecret = document.getElementById('firebaseSecret');
  const firebaseStatus = document.getElementById('firebaseStatus');
  const firebaseAutoSync = document.getElementById('firebaseAutoSync');

  document.getElementById('firebaseToggleBtn').addEventListener('click', ()=>{
    firebaseBox.style.display = firebaseBox.style.display === 'none' ? 'block' : 'none';
  });

  function cleanDbUrl(url){
    return url.trim().replace(/\/$/, '');
  }

  function buildFbEndpoint(){
    const base = cleanDbUrl(firebaseUrl.value);
    if(!base) return null;
    const secret = firebaseSecret.value.trim();
    return `${base}/dev-journal-entries.json${secret ? '?auth=' + encodeURIComponent(secret) : ''}`;
  }

  async function loadFirebaseConfig(){
    try{
      const u = await window.storage.get(FB_URL_KEY, false);
      if(u && u.value) firebaseUrl.value = u.value;
    }catch(e){}
    try{
      const s = await window.storage.get(FB_SECRET_KEY, false);
      if(s && s.value) firebaseSecret.value = s.value;
    }catch(e){}
    try{
      const a = await window.storage.get(FB_AUTOSYNC_KEY, false);
      firebaseAutoSync.checked = a && a.value === 'true';
    }catch(e){}
  }

  document.getElementById('firebaseSaveBtn').addEventListener('click', async ()=>{
    if(!firebaseUrl.value.trim()){
      firebaseStatus.textContent = 'Pega la URL de tu Realtime Database primero.';
      return;
    }
    try{
      await window.storage.set(FB_URL_KEY, cleanDbUrl(firebaseUrl.value), false);
      await window.storage.set(FB_SECRET_KEY, firebaseSecret.value.trim(), false);
      firebaseStatus.textContent = 'Configuración guardada ✓';
    }catch(e){
      firebaseStatus.textContent = 'No se pudo guardar la configuración.';
    }
  });

  firebaseAutoSync.addEventListener('change', async ()=>{
    try{ await window.storage.set(FB_AUTOSYNC_KEY, String(firebaseAutoSync.checked), false); }catch(e){}
  });

  async function syncToFirebase(silent){
    const endpoint = buildFbEndpoint();
    if(!endpoint){
      if(!silent) firebaseStatus.textContent = 'Pega la URL de tu Realtime Database primero.';
      return false;
    }
    if(!silent) firebaseStatus.textContent = 'Subiendo...';
    try{
      const res = await fetch(endpoint, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(entries)
      });
      if(!res.ok){
        const t = await res.text();
        throw new Error(`${res.status}: ${t.slice(0,150)}`);
      }
      if(!silent) firebaseStatus.textContent = 'Sincronizado con Firebase ✓ (' + new Date().toLocaleTimeString() + ')';
      return true;
    }catch(e){
      firebaseStatus.textContent = 'Error al subir: ' + e.message + ' (revisa la URL y las reglas de la base de datos)';
      return false;
    }
  }

  document.getElementById('firebaseSyncBtn').addEventListener('click', ()=> syncToFirebase(false));

  document.getElementById('firebasePullBtn').addEventListener('click', async ()=>{
    const endpoint = buildFbEndpoint();
    if(!endpoint){
      firebaseStatus.textContent = 'Pega la URL de tu Realtime Database primero.';
      return;
    }
    firebaseStatus.textContent = 'Descargando...';
    try{
      const res = await fetch(endpoint);
      if(!res.ok){
        const t = await res.text();
        throw new Error(`${res.status}: ${t.slice(0,150)}`);
      }
      const cloudEntries = await res.json();
      if(!cloudEntries){
        firebaseStatus.textContent = 'La nube está vacía, no hay nada que traer.';
        return;
      }
      const list = Array.isArray(cloudEntries) ? cloudEntries.filter(Boolean) : Object.values(cloudEntries);
      const existingIds = new Set(entries.map(e=>e.id));
      let added = 0;
      list.forEach(e=>{
        if(e && e.id && !existingIds.has(e.id)){
          entries.push(e);
          added++;
        }
      });
      entries.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
      await saveIndex();
      renderList();
      firebaseStatus.textContent = `Traídas ${added} entrada(s) nueva(s) desde la nube ✓`;
    }catch(e){
      firebaseStatus.textContent = 'Error al descargar: ' + e.message;
    }
  });

  loadFirebaseConfig();

  // ---------- GitHub Gist sync ----------
  const GIST_TOKEN_KEY = 'github-gist-token';
  const GIST_ID_KEY = 'github-gist-id';
  const gistBox = document.getElementById('gistBox');
  const gistToken = document.getElementById('gistToken');
  const gistStatus = document.getElementById('gistStatus');

  document.getElementById('gistToggleBtn').addEventListener('click', ()=>{
    gistBox.style.display = gistBox.style.display === 'none' ? 'block' : 'none';
  });

  async function loadGistToken(){
    try{
      const res = await window.storage.get(GIST_TOKEN_KEY, false);
      if(res && res.value) gistToken.value = res.value;
    }catch(e){}
  }

  document.getElementById('gistSaveTokenBtn').addEventListener('click', async ()=>{
    const token = gistToken.value.trim();
    if(!token){ gistStatus.textContent = 'Pega un token primero.'; return; }
    try{
      await window.storage.set(GIST_TOKEN_KEY, token, false);
      gistStatus.textContent = 'Token guardado localmente ✓';
    }catch(e){
      gistStatus.textContent = 'No se pudo guardar el token.';
    }
  });

  document.getElementById('gistSyncBtn').addEventListener('click', async ()=>{
    const token = gistToken.value.trim();
    if(!token){
      gistStatus.textContent = 'Pega tu token de GitHub (Settings → Developer settings → Personal access tokens, con permiso "gist").';
      return;
    }
    gistStatus.textContent = 'Sincronizando...';
    try{
      let gistId = null;
      try{
        const res = await window.storage.get(GIST_ID_KEY, false);
        if(res && res.value) gistId = res.value;
      }catch(e){}

      const body = {
        description: 'Dev Journal backup',
        public: false,
        files: {
          'dev-journal.json': {
            content: JSON.stringify(entries, null, 2)
          }
        }
      };

      let response;
      if(gistId){
        response = await fetch(`https://api.github.com/gists/${gistId}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github+json'
          },
          body: JSON.stringify(body)
        });
      } else {
        response = await fetch('https://api.github.com/gists', {
          method: 'POST',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github+json'
          },
          body: JSON.stringify(body)
        });
      }

      if(!response.ok){
        const errText = await response.text();
        throw new Error(`${response.status}: ${errText.slice(0,120)}`);
      }

      const data = await response.json();
      if(!gistId){
        await window.storage.set(GIST_ID_KEY, data.id, false);
      }
      gistStatus.innerHTML = `Sincronizado ✓ <br><a href="${data.html_url}" target="_blank" style="color:var(--teal)">ver gist</a>`;
    }catch(e){
      gistStatus.textContent = 'Error al sincronizar: ' + e.message;
    }
  });

  loadGistToken();

  (async function init(){
    dateStamp.textContent = fmtDate(new Date().toISOString());
    await loadIndex();
    renderList();
    if(entries.length){
      openEntry(entries[0].id);
    } else {
      clearForm();
    }
  })();
})();
</script>
</body>
</html>
